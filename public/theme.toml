# theme.toml template for a Hugo theme
# See https://github.com/gohugoio/hugoThemes#themetoml for an example

name = "Toxin"
license = "MIT"
licenselink = "https://github.com/Deceit-and-Disease/toxin/blob/master/LICENSE"
description = "A ripoff of Poison by Luke Orth"
homepage = "http://example.com/"
tags = ["blog", "personal", "dark", "dark-mode", "light", "minimal"]
features = ["blog", "table-of-contents", "tabs", "dark-mode", "series"]
min_version = "0.101.0"

[author]
  name = ""
  homepage = "/"

# If porting an existing theme
[original]
  name = "Poison"
  homepage = "https://github.com/lukeorth/poison"
  repo = "https://github.com/lukeorth/poison"
